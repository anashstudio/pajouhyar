<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>پژوهیار — دستیار تحقیق و مقاله‌نویسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F6F7FB;
  --surface:#FFFFFF;
  --surface-2:#F0F2FA;
  --ink:#1B1E2B;
  --ink-soft:#666B80;
  --ink-faint:#9297A8;
  --line:#E6E8F0;
  --g1:#4C7CF0; --g2:#8B5CF6; --g3:#EC6FBB;
  --grad: linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g3));
  --grad-soft: linear-gradient(120deg, rgba(76,124,240,.10), rgba(139,92,246,.10) 55%, rgba(236,111,187,.10));
  --ok:#1E9E6B; --warn:#C97A16; --err:#D64545;
  --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(27,30,43,.05), 0 3px 10px rgba(27,30,43,.05);
  --shadow-md:0 4px 14px rgba(27,30,43,.08), 0 12px 32px rgba(27,30,43,.07);
}
html[data-theme="dark"]{
  --bg:#14151F;
  --surface:#1C1E2B;
  --surface-2:#242637;
  --ink:#EDEEF5;
  --ink-soft:#A3A7BD;
  --ink-faint:#71758C;
  --line:#31334A;
  --grad-soft: linear-gradient(120deg, rgba(76,124,240,.16), rgba(139,92,246,.16) 55%, rgba(236,111,187,.16));
  --shadow-sm:0 1px 2px rgba(0,0,0,.25), 0 3px 10px rgba(0,0,0,.2);
  --shadow-md:0 4px 14px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.25);
}
html[data-theme="dark"] .login-card{ background:rgba(28,30,43,.72); border-color:rgba(255,255,255,.08); }
html[data-theme="dark"] .bottom-nav{ background:rgba(28,30,43,.9); }
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}
::selection{background:rgba(139,92,246,.25);}
h1,h2,h3{font-family:inherit;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- utility ---------- */
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.pill{border-radius:999px;}
.scrollx{overflow-x:auto;scrollbar-width:none;}
.scrollx::-webkit-scrollbar{display:none;}

/* ---------- brand mark ---------- */
.spark{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(139,92,246,.35);
  position:relative;
}
.spark svg{width:20px;height:20px;fill:#fff;}
.spark-lg{width:64px;height:64px;border-radius:18px;}
.spark-lg svg{width:30px;height:30px;}
.spark-sm{width:26px;height:26px;border-radius:8px;}
.spark-sm svg{width:13px;height:13px;}

/* ---------- login ---------- */
.login-screen{
  flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:36px 26px;overflow:hidden;
}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;z-index:0;}
.orb1{width:260px;height:260px;background:#4C7CF0;top:-90px;right:-70px;}
.orb2{width:220px;height:220px;background:#EC6FBB;bottom:-60px;left:-60px;}
.orb3{width:180px;height:180px;background:#8B5CF6;top:40%;left:10%;opacity:.35;}
.login-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--radius-lg);
  padding:30px 26px;
  box-shadow:var(--shadow-md);
  display:flex;flex-direction:column;gap:20px;
}
.brand-col{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
.brand-col h1{margin:0;font-size:20px;font-weight:800;}
.brand-col p{margin:0;font-size:12.5px;color:var(--ink-soft);}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;color:var(--ink-soft);font-weight:700;}
.field input, .field select, .field textarea{
  border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  padding:13px 14px;font-size:15px;color:var(--ink);outline:none;
  transition:border-color .15s, box-shadow .15s;width:100%;
}
.field textarea{resize:vertical;min-height:72px;line-height:1.8;}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--g2);box-shadow:0 0 0 4px rgba(139,92,246,.13);
}

.btn{border:none;border-radius:var(--radius-sm);padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55;cursor:default;}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(139,92,246,.32);}
.btn-grad:hover{filter:brightness(1.05);}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
.btn-soft{background:var(--surface-2);color:var(--g2);}
.btn-danger{background:transparent;color:var(--err);border:1.5px solid rgba(214,69,69,.28);}
.btn-full{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}

.error-msg{background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.25);color:var(--err);padding:10px 13px;border-radius:10px;font-size:13px;display:none;}
.hint-box{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:11.5px;color:var(--ink-soft);line-height:2;background:var(--surface-2);}
.hint-box b{color:var(--ink);}

/* ---------- top bar ---------- */
.topbar{
  background:var(--grad);color:#fff;padding:20px 20px 46px;position:relative;
  border-bottom-left-radius:28px;border-bottom-right-radius:28px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.topbar .who{font-size:12.5px;opacity:.85;margin:0 0 2px;}
.topbar .name{font-size:18px;font-weight:800;margin:0;}
.icon-chip{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
.topbar-search{
  margin-top:16px;background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;
  font-size:13px;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:8px;
}

.content{padding:20px;display:flex;flex-direction:column;gap:16px;flex:1;padding-bottom:100px;}
.content.pull-up{margin-top:-30px;}

.section-eyebrow{font-size:11.5px;letter-spacing:.4px;color:var(--ink-soft);font-weight:800;display:flex;align-items:center;gap:8px;margin:4px 2px 0;}
.section-eyebrow::after{content:"";flex:1;height:1px;background:var(--line);}

/* ---------- feature cards ---------- */
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.fcard .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.fcard h3{margin:0;font-size:13.5px;font-weight:800;line-height:1.4;}
.fcard p{margin:0;font-size:11px;color:var(--ink-soft);line-height:1.6;}
.fcard.wide{grid-column:1/-1;flex-direction:row;align-items:center;}
.fcard.wide .ic{flex-shrink:0;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:40;
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--ink-faint);font-size:10.5px;font-weight:700;background:none;border:none;}
.nav-item .nic{font-size:19px;}
.nav-item.active{color:var(--g2);}
.nav-item.active .nic{transform:translateY(-1px);}

/* ---------- header w/ back ---------- */
.header-bar{display:flex;align-items:center;gap:12px;padding:18px 20px 6px;}
.back-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--g2);flex-shrink:0;}
.header-bar h2{font-size:16.5px;margin:0;font-weight:800;flex:1;}

/* ---------- badges/chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--ink-soft);font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;}
.chip.selected{background:var(--grad);color:#fff;border-color:transparent;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- progress / loading ---------- */
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.step-dot.done{background:var(--ok);}
.step-dot.active{background:var(--g2);animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(139,92,246,.25);border-top-color:var(--g2);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- article render ---------- */
.article-paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px 20px;box-shadow:var(--shadow-sm);line-height:2;font-size:14.5px;}
.article-paper h1{font-size:19px;margin:0 0 6px;font-weight:800;}
.article-paper h2{font-size:16px;margin:22px 0 8px;font-weight:800;color:var(--g2);}
.article-paper h3{font-size:14.5px;margin:16px 0 6px;font-weight:700;}
.article-paper p{margin:0 0 12px;color:#2A2E3D;}
.article-paper .abstract{background:var(--surface-2);padding:14px 16px;border-radius:12px;font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;}
.article-paper table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;}
.article-paper th,.article-paper td{border:1px solid var(--line);padding:8px 10px;text-align:right;}
.article-paper th{background:var(--surface-2);font-weight:700;}
.article-paper .refs{font-size:12.5px;color:var(--ink-soft);}
.article-paper .refs li{margin-bottom:8px;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,22,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
.modal{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-top-left-radius:26px;border-top-right-radius:26px;padding:22px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.2);}
.modal-handle{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 4px;}
.modal h3{margin:0;font-size:16.5px;font-weight:800;}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
.checkbox-row input{margin-top:3px;}
.checkbox-row .cb-txt b{display:block;font-size:13.5px;}
.checkbox-row .cb-txt span{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
.modal-actions{display:flex;gap:10px;margin-top:4px;}
.modal-actions .btn{flex:1;}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:100;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.empty-state{text-align:center;color:var(--ink-soft);font-size:13px;padding:36px 14px;}
.loading-screen{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;gap:10px;}

.switch{position:relative;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#D9D2C0;border-radius:24px;cursor:pointer;transition:.2s;}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
input:checked + .slider{background:var(--ok);}
input:checked + .slider::before{transform:translateX(-18px);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--surface-2);border-radius:12px;padding:13px;text-align:center;}
.stat-box .v{font-size:19px;font-weight:800;color:var(--g2);}
.stat-box .l{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}

@media print{
  .bottom-nav,.header-bar,.toolbar,.no-print{display:none !important;}
  #app{max-width:100%;}
  .article-paper{box-shadow:none;border:none;}
}
</style>
</head>

/* ---------------- Storage helpers (localStorage — نسخه مستقل/APK) ---------------- */
async function storeGet(key, shared=false){
  try{ const v = localStorage.getItem('pajouhyar_'+key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function storeSet(key, value, shared=false){
  try{ localStorage.setItem('pajouhyar_'+key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------- Toast ---------------- */
function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},2000);
}

/* ---------------- Init ---------------- */
function applyTheme(){
  const t = localStorage.getItem('pajouhyar_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme(){
  const cur = localStorage.getItem('pajouhyar_theme') || 'light';
  const next = cur === 'light' ? 'dark' : 'light';
  localStorage.setItem('pajouhyar_theme', next);
  applyTheme();
  render();
}

async function init(){
  applyTheme();
  let users = await storeGet('users', false);
  if(!users){
    const hash = await sha256('admin123');
    users = [{id:1, username:'admin', passwordHash:hash, isActive:true, isAdmin:true}];
    await storeSet('users', users, false);
  }
  state.users = users;
  state.history = (await storeGet('history', false)) || [];
  render();
}

/* ---------------- Multi-provider AI helpers ---------------- */
const AI_PROVIDERS = {
  claude: { label:'Claude (Anthropic)', keyName:'pajouhyar_key_claude', guideUrl:'https://console.anthropic.com/settings/keys', guideText:'وارد console.anthropic.com شو، از بخش API Keys یه کلید بساز (نیاز به شارژ حساب داره).' },
  gemini: { label:'Gemini (Google) — رایگان', keyName:'pajouhyar_key_gemini', guideUrl:'https://aistudio.google.com/apikey', guideText:'وارد aistudio.google.com شو (با همون اکانت گوگل خودت)، روی «Create API key» بزن — کاملاً رایگانه، نیاز به کارت اعتباری نداره.' },
  openai: { label:'ChatGPT (OpenAI)', keyName:'pajouhyar_key_openai', guideUrl:'https://platform.openai.com/api-keys', guideText:'وارد platform.openai.com شو، از بخش API Keys یه کلید بساز (نیاز به شارژ حساب داره).' },
};
function getActiveProvider(){ return localStorage.getItem('pajouhyar_provider') || 'gemini'; }
function getProviderKey(p){ return localStorage.getItem(AI_PROVIDERS[p].keyName) || ''; }

async function callClaudeOnce(systemPrompt, userPrompt, useSearch){
  const apiKey = getProviderKey('claude');
  if(!apiKey) throw new Error('کلید Claude تنظیم نشده — از پروفایل، کلیدت را وارد کن');
  const body = {
    model:"claude-sonnet-4-6",
    max_tokens:1000,
    system: systemPrompt,
    messages:[{role:"user", content:userPrompt}],
  };
  if(useSearch){ body.tools = [{type:"web_search_20250305", name:"web_search"}]; }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify(body)
  });
  let data;
  try{ data = await res.json(); } catch(e){ throw new Error(`پاسخ نامعتبر از سرور (کد ${res.status})`); }
  if(data.error){
    const t = data.error.type || '';
    let msg = data.error.message || 'خطای API';
    if(t.includes('overloaded') || res.status===529) msg = 'سرور موقتاً شلوغ است';
    if(t.includes('rate_limit') || res.status===429) msg = 'محدودیت نرخ درخواست — کمی صبر کن';
    throw new Error(msg);
  }
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  if(!text.trim()) throw new Error('پاسخ خالی از مدل دریافت شد');
  return text;
}

async function callGeminiOnce(systemPrompt, userPrompt, useSearch){
  const apiKey = getProviderKey('gemini');
  if(!apiKey) throw new Error('کلید Gemini تنظیم نشده — از پروفایل، کلیدت را وارد کن');
  const body = {
    contents:[{ role:"user", parts:[{ text: userPrompt }] }],
    systemInstruction: { parts:[{ text: systemPrompt }] },
    generationConfig:{ maxOutputTokens: 2048 },
  };
  if(useSearch){ body.tools = [{ google_search: {} }]; }
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  let data;
  try{ data = await res.json(); } catch(e){ throw new Error(`پاسخ نامعتبر از سرور (کد ${res.status})`); }
  if(data.error){
    let msg = data.error.message || 'خطای API';
    if(res.status===429) msg = 'محدودیت نرخ رایگان — کمی صبر کن';
    throw new Error(msg);
  }
  const text = (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n');
  if(!text.trim()) throw new Error('پاسخ خالی از مدل دریافت شد');
  return text;
}

async function callOpenAiOnce(systemPrompt, userPrompt, useSearch){
  const apiKey = getProviderKey('openai');
  if(!apiKey) throw new Error('کلید OpenAI تنظیم نشده — از پروفایل، کلیدت را وارد کن');
  const body = {
    model:"gpt-4o-mini",
    max_tokens:1200,
    messages:[ {role:"system", content:systemPrompt}, {role:"user", content:userPrompt} ],
  };
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization": `Bearer ${apiKey}` },
    body: JSON.stringify(body)
  });
  let data;
  try{ data = await res.json(); } catch(e){ throw new Error(`پاسخ نامعتبر از سرور (کد ${res.status})`); }
  if(data.error){
    let msg = data.error.message || 'خطای API';
    if(res.status===429) msg = 'محدودیت نرخ درخواست — کمی صبر کن';
    throw new Error(msg);
  }
  const text = data.choices?.[0]?.message?.content || '';
  if(!text.trim()) throw new Error('پاسخ خالی از مدل دریافت شد');
  return text;
}

async function callClaude(systemPrompt, userPrompt, useSearch, retries=2){
  const provider = getActiveProvider();
  const fn = provider==='gemini' ? callGeminiOnce : provider==='openai' ? callOpenAiOnce : callClaudeOnce;
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      return await fn(systemPrompt, userPrompt, useSearch);
    }catch(e){
      lastErr = e;
      if(attempt < retries) await new Promise(r=>setTimeout(r, 900 * (attempt+1)));
    }
  }
  throw lastErr;
}

  else if(state.screen==='about') html = viewAbout();

  const showNav = ['home','survey-hub','about'].includes(state.screen) || (state.screen==='research-form');

}

async function handleLogin(){
  const username = document.getElementById('lg-username').value.trim();
  const password = document.getElementById('lg-password').value;
  const errBox = document.getElementById('lg-error');
  errBox.style.display='none';
  if(!username || !password){ errBox.textContent='لطفاً نام کاربری و رمز عبور را وارد کنید'; errBox.style.display='block'; return; }
  const hash = await sha256(password);
  const user = state.users.find(u=>u.username===username);
  if(!user || user.passwordHash!==hash){ errBox.textContent='نام کاربری یا رمز عبور اشتباه است'; errBox.style.display='block'; return; }
  if(!user.isActive){ errBox.textContent='این حساب کاربری غیرفعال شده است'; errBox.style.display='block'; return; }
  state.currentUser = user; state.screen='home'; state.tab='home'; render();
}

function collectChip(containerId){
  const el = document.getElementById(containerId);
  const sel = el.querySelector('.chip.selected');
  return sel ? sel.dataset.val : null;
}
function bindChipRow(containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      el.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
      if(containerId==='rf-range'){
        document.getElementById('rf-range-custom').style.display = (c.dataset.val==='custom') ? 'flex' : 'none';
      }
    });
  });
}

function startResearch(){
  const topic = document.getElementById('rf-topic').value.trim();
  if(!topic){ toast('لطفاً موضوع مقاله را وارد کن'); return; }

  let rangeText = '';
  const rangeVal = collectChip('rf-range');
  if(rangeVal==='custom'){
    const from = document.getElementById('rf-range-from').value || 'هر سالی';
    const to = document.getElementById('rf-range-to').value || 'اکنون';
    rangeText = `از سال ${from} تا ${to}`;
  } else if(rangeVal==='0'){ rangeText = 'بدون محدودیت زمانی'; }
  else { rangeText = `${rangeVal} سال اخیر`; }

  state.researchOptions = {
    topic,
    keywords: document.getElementById('rf-keywords').value.trim(),
    articleType: collectChip('rf-type'),
    audience: collectChip('rf-audience'),
    length: collectChip('rf-length'),
    language: collectChip('rf-lang'),
    citationStyle: collectChip('rf-citation'),
    sourceRange: rangeText,
    addSwot: document.getElementById('rf-add-swot').checked,
    addReliability: document.getElementById('rf-add-reliability').checked,
    useRealStats: document.getElementById('rf-use-real-stats')?.checked || false,
    addLitTable: document.getElementById('rf-add-littable').checked,
    addFuture: document.getElementById('rf-add-future').checked,
    notes: document.getElementById('rf-notes').value.trim(),
  };

  state.screen='research-result';
  render();
  runResearchGeneration();
}

  if(opt.length!=='short') plan.push({key:'body2', title:'بدنه اصلی — بخش دوم'});
  if(opt.length==='long') plan.push({key:'body3', title:'بدنه اصلی — بخش سوم'});
  if(opt.addLitTable) plan.push({key:'littable', title:'جدول مقایسه‌ای پیشینه'});

function sectionUserPrompt(opt, sec, prevOutline){

async function runResearchGeneration(){
  const opt = state.researchOptions;
  const plan = buildSectionPlan(opt);
  state.researchSections = plan.map(p=>({...p, html:'', status:'pending'}));
  state.researchBusy = true;
  renderResultBody();

  const sys = baseSystemPrompt(opt);
  const outline = [];
  const useSearch = ['intro','litreview','body1','body2','body3','littable','references'];

  for(let i=0;i<state.researchSections.length;i++){
    const sec = state.researchSections[i];
    sec.status='active';
    renderResultBody();
    try{
      const userPrompt = sectionUserPrompt(opt, sec, outline);
      const text = await callClaude(sys, userPrompt, useSearch.includes(sec.key));
      sec.html = text.trim();
      sec.status='done';
      outline.push(sec.title);
    }catch(e){
      sec.status='error';
      sec.error = e.message || 'خطا در تولید این بخش';
    }
    renderResultBody();
  }
  state.researchBusy = false;
  await saveArticleToHistory();
  renderResultBody();
}

async function saveArticleToHistory(){
  const opt = state.researchOptions;
  const fullHtml = state.researchSections.map(s=>s.html).join('\n');
  const entry = {
    id: uid(),
    type:'article',
    title: opt.topic,
    date: new Date().toLocaleDateString('fa-IR'),
    html: fullHtml,
  };
  state.currentArticle = entry;
  state.history.unshift(entry);
  if(state.history.length>30) state.history = state.history.slice(0,30);
  await storeSet('history', state.history, false);
}

  return `
  <div class="header-bar">

}

function renderResultBody(){
  const box = document.getElementById('result-body');
  if(!box) return;
  const opt = state.researchOptions;
  const doneCount = state.researchSections.filter(s=>s.status==='done').length;

  let progressHtml = `
  <div class="card" style="display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;align-items:center;justify-content:between;gap:8px;">
      <div style="font-size:13px;font-weight:700;flex:1;">${doneCount} از ${state.researchSections.length} بخش تولید شد</div>
      ${state.researchBusy ? '<div class="spinner"></div>' : ''}
    </div>
    <div style="display:flex;gap:6px;">
      ${state.researchSections.map(s=>`<div class="step-dot ${s.status==='done'?'done':s.status==='active'?'active':''}"></div>`).join('')}
    </div>
  </div>`;

  let articleHtml = `<div class="article-paper" id="article-render">`;
  state.researchSections.forEach(s=>{
    if(s.status==='done'){ articleHtml += s.html; }
    else if(s.status==='error'){
      articleHtml += `<div style="border:1px dashed var(--err);border-radius:10px;padding:12px 14px;margin-bottom:14px;">
        <p style="color:var(--err);font-size:13px;margin:0 0 8px;">⚠️ خطا در «${escapeHtml(s.title)}»: ${escapeHtml(s.error||'')}</p>
        <button class="btn btn-soft btn-sm no-print" data-retry-section="${s.key}">🔁 تلاش دوباره برای این بخش</button>
      </div>`;
    }
  });
  articleHtml += `</div>`;

  let toolbarHtml = !state.researchBusy ? `
  <div class="toolbar no-print">
    <button class="btn btn-grad btn-sm" id="btn-download-word">📥 دانلود Word</button>
    <button class="btn btn-ghost btn-sm" id="btn-print-pdf">🖨️ چاپ / PDF</button>
    <button class="btn btn-soft btn-sm" id="btn-copy-article">📋 کپی متن</button>
  </div>` : '';

  box.innerHTML = progressHtml + toolbarHtml + articleHtml;

  document.getElementById('btn-download-word')?.addEventListener('click', downloadArticleAsWord);
  document.getElementById('btn-print-pdf')?.addEventListener('click', ()=>window.print());
  document.getElementById('btn-copy-article')?.addEventListener('click', ()=>{
    const txt = document.getElementById('article-render').innerText;
    navigator.clipboard?.writeText(txt).then(()=>toast('متن مقاله کپی شد')).catch(()=>toast('کپی ناموفق بود'));
  });
  document.querySelectorAll('[data-retry-section]').forEach(btn=>{
    btn.addEventListener('click', ()=>retrySection(btn.dataset.retrySection));
  });
}

async function retrySection(key){
  const opt = state.researchOptions;
  const sec = state.researchSections.find(s=>s.key===key);
  if(!sec) return;
  const idx = state.researchSections.indexOf(sec);
  const outline = state.researchSections.slice(0, idx).filter(s=>s.status==='done').map(s=>s.title);
  sec.status='active'; sec.error=null;
  renderResultBody();
  const useSearch = ['intro','litreview','body1','body2','body3','littable','references'];
  try{
    const userPrompt = sectionUserPrompt(opt, sec, outline);
    const sys = baseSystemPrompt(opt);
    const text = await callClaude(sys, userPrompt, useSearch.includes(sec.key));
    sec.html = text.trim();
    sec.status='done';
    await saveArticleToHistory();
  }catch(e){
    sec.status='error';
    sec.error = e.message || 'خطا در تولید این بخش';
  }
  renderResultBody();
}

function downloadArticleAsWord(){
  const content = document.getElementById('article-render').innerHTML;
  const opt = state.researchOptions;
  const docHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset='utf-8'><title>${escapeHtml(opt.topic)}</title>
  <style>body{font-family:Tahoma,Arial;direction:rtl;line-height:2;} h1{font-size:20pt;} h2{font-size:15pt;color:#2C5468;} h3{font-size:13pt;} table{border-collapse:collapse;width:100%;} td,th{border:1px solid #999;padding:6px;}</style>
  </head><body dir="rtl">${content}</body></html>`;
  const blob = new Blob(['\ufeff', docHtml], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (opt.topic.slice(0,40) || 'article') + '.doc';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('فایل Word دانلود شد');
}
</script>

function cronbachAlpha(matrix){
  // matrix: rows = respondents, cols = items (numeric)
  const n = matrix.length, k = matrix[0].length;
  const itemVar = [];
  for(let c=0;c<k;c++){
    const col = matrix.map(row=>row[c]);
    const mean = col.reduce((a,b)=>a+b,0)/n;
    const variance = col.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(n-1);
    itemVar.push({mean, sd:Math.sqrt(variance), variance});
  }
  const totalScores = matrix.map(row=>row.reduce((a,b)=>a+b,0));
  const totalMean = totalScores.reduce((a,b)=>a+b,0)/n;
  const totalVar = totalScores.reduce((a,b)=>a+Math.pow(b-totalMean,2),0)/(n-1);
  const sumItemVar = itemVar.reduce((a,v)=>a+v.variance,0);
  const alpha = (k/(k-1)) * (1 - sumItemVar/totalVar);
  return {alpha, itemVar};
}

async function runExcelAnalysis(){
  const fileInput = document.getElementById('analyze-file');
  const file = fileInput.files[0];
  if(!file){ toast('لطفاً یک فایل انتخاب کن'); return; }
  const btn = document.getElementById('btn-run-analyze');
  btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> در حال پردازش…';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    const headers = rows[0];
    let dataRows = rows.slice(1).filter(r=>r.length && r.some(v=>v!==undefined && v!==''));

    // پیدا کردن ستون‌های عددی (نادیده گرفتن ستون شناسه احتمالی)
    const numericCols = [];
    headers.forEach((h,idx)=>{
      const vals = dataRows.map(r=>r[idx]);
      const numericCount = vals.filter(v=>typeof v === 'number').length;
      if(numericCount >= vals.length*0.6 && numericCount>0) numericCols.push(idx);
    });
    if(numericCols.length < 2){ throw new Error('حداقل دو ستون عددی برای محاسبه آلفا لازم است'); }

    const matrix = dataRows.map(r=>numericCols.map(idx=>Number(r[idx])||0))
                            .filter(row=>row.every(v=>!isNaN(v)));

    const {alpha, itemVar} = cronbachAlpha(matrix);
    let alphaLabel = 'ضعیف';
    if(alpha>=.9) alphaLabel='عالی'; else if(alpha>=.8) alphaLabel='خوب'; else if(alpha>=.7) alphaLabel='قابل قبول'; else if(alpha>=.6) alphaLabel='مشکوک';

    state.analyzeResult = {
      n: matrix.length, k: numericCols.length, alpha, alphaLabel,
      items: numericCols.map((idx,i)=>({name: headers[idx] || `گویه ${i+1}`, mean:itemVar[i].mean, sd:itemVar[i].sd}))
    };
    render();
    toast('تحلیل با موفقیت انجام شد');
  }catch(e){
    toast('خطا: ' + (e.message||'پردازش فایل ناموفق بود'));
    btn.disabled=false; btn.innerHTML='محاسبه آمار و آلفای کرونباخ';
  }
}

function copyStatsSummary(){
  const r = state.analyzeResult;
  let txt = `تحلیل پایایی پرسشنامه:\nتعداد نمونه (N) = ${r.n}\nتعداد گویه (k) = ${r.k}\nضریب آلفای کرونباخ = ${r.alpha.toFixed(2)} (سطح ${r.alphaLabel})\n\nآمار توصیفی گویه‌ها:\n`;
  r.items.forEach(it=>{ txt += `- ${it.name}: میانگین=${it.mean.toFixed(2)}, انحراف معیار=${it.sd.toFixed(2)}\n`; });
  navigator.clipboard?.writeText(txt).then(()=>toast('خلاصه نتایج کپی شد')).catch(()=>toast('کپی ناموفق بود'));
}
</script>

  document.getElementById('modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') e.target.remove(); });
  document.getElementById('nu-save').addEventListener('click', saveNewUser);
}
async function saveNewUser(){
  const username = document.getElementById('nu-username').value.trim();
  const password = document.getElementById('nu-password').value;
  const isAdmin = document.getElementById('nu-admin').checked;
  const errBox = document.getElementById('nu-error');
  errBox.style.display='none';
  if(!username || !password){ errBox.textContent='لطفاً همه فیلدها را پر کنید'; errBox.style.display='block'; return; }
  if(state.users.some(u=>u.username===username)){ errBox.textContent='این نام کاربری قبلاً ثبت شده است'; errBox.style.display='block'; return; }
  const hash = await sha256(password);
  const newId = state.users.length ? Math.max(...state.users.map(u=>u.id))+1 : 1;
  state.users.push({id:newId, username, passwordHash:hash, isActive:true, isAdmin});
  await storeSet('users', state.users, false);
  document.getElementById('modal-backdrop').remove();
  render();
  toast('کاربر جدید اضافه شد');
}

<script>
/* ============================================================
   EVENT BINDING (central)
   ============================================================ */
function bindEvents(){
  // bottom nav
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tab = el.dataset.nav;
      state.screen = el.dataset.screen;
      if(state.screen==='research-result' && !state.researchSections.length) state.screen='research-form';
      render();
    });
  });

  if(state.screen==='login'){
    document.getElementById('btn-login').addEventListener('click', handleLogin);
    document.getElementById('lg-password').addEventListener('keydown', e=>{ if(e.key==='Enter') handleLogin(); });
  }

  if(state.screen==='home'){
    document.getElementById('btn-logout').addEventListener('click', doLogout);
    document.getElementById('card-research').addEventListener('click', ()=>{ state.tab='research'; state.screen='research-form'; render(); });
    document.getElementById('card-survey').addEventListener('click', ()=>{ state.tab='survey'; state.screen='survey-hub'; render(); });
    document.getElementById('card-swot').addEventListener('click', ()=>{ toast('گزینه SWOT داخل فرم تولید مقاله قابل انتخاب است'); state.tab='research'; state.screen='research-form'; render(); });
    document.getElementById('card-cronbach').addEventListener('click', ()=>{ state.tab='survey'; state.screen='survey-analyze'; render(); });
    document.getElementById('card-admin')?.addEventListener('click', ()=>{ state.screen='admin'; render(); });
    document.querySelectorAll('[data-open-history]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const h = state.history.find(x=>x.id===el.dataset.openHistory);
        if(!h) return;
        if(h.type==='article'){
          state.researchOptions = state.researchOptions || {topic:h.title, citationStyle:'APA'};
          state.researchSections = [{key:'saved', title:h.title, html:h.html, status:'done'}];
          state.researchBusy = false;
          state.screen='research-result'; state.tab='research';
          render();
        }
      });
    });
  }

  if(state.screen==='research-form'){
    bindChipRow('rf-type'); bindChipRow('rf-audience'); bindChipRow('rf-length');
    bindChipRow('rf-lang'); bindChipRow('rf-citation'); bindChipRow('rf-range');
    document.getElementById('btn-generate').addEventListener('click', startResearch);
  }

  if(state.screen==='research-result'){
    document.getElementById('btn-back-home').addEventListener('click', ()=>{ state.tab='home'; state.screen='home'; render(); });
    renderResultBody();
  }

  if(state.screen==='survey-hub'){
    document.getElementById('card-analyze-excel').addEventListener('click', ()=>{ state.screen='survey-analyze'; render(); });
    document.getElementById('btn-ai-survey').addEventListener('click', generateAiSurvey);
    document.querySelectorAll('[data-template]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.activeTemplate = SURVEY_TEMPLATES.find(t=>t.id===el.dataset.template);
        state.screen='survey-template'; render();
      });
    });
  }

  if(state.screen==='survey-template'){
    document.getElementById('btn-back-survey').addEventListener('click', ()=>{ state.screen='survey-hub'; render(); });
    document.getElementById('btn-export-excel').addEventListener('click', exportTemplateToExcel);
  }

  if(state.screen==='survey-analyze'){
    document.getElementById('btn-back-survey2').addEventListener('click', ()=>{ state.analyzeResult=null; state.screen='survey-hub'; render(); });
    document.getElementById('btn-run-analyze')?.addEventListener('click', runExcelAnalysis);
    document.getElementById('btn-copy-stats')?.addEventListener('click', copyStatsSummary);
    document.getElementById('btn-analyze-again')?.addEventListener('click', ()=>{ state.analyzeResult=null; render(); });
  }

  if(state.screen==='admin'){
    document.getElementById('btn-back-home2').addEventListener('click', ()=>{ state.tab='home'; state.screen='home'; render(); });
    document.getElementById('btn-add-user').addEventListener('click', openAddUserModal);
    document.querySelectorAll('.toggle-active').forEach(el=>{
      el.addEventListener('change', async e=>{
        const id = Number(e.target.dataset.id);
        const user = state.users.find(u=>u.id===id);
        user.isActive = e.target.checked;
        await storeSet('users', state.users, false);
        toast(user.isActive ? `«${user.username}» فعال شد` : `«${user.username}» غیرفعال شد`);
      });
    });
    document.querySelectorAll('.btn-delete-user').forEach(el=>{
      el.addEventListener('click', async e=>{
        const id = Number(e.currentTarget.dataset.id);
        const user = state.users.find(u=>u.id===id);
        if(!user) return;
        if(user.username === state.currentUser.username){ toast('نمی‌توانید حساب خودتان را حذف کنید'); return; }
        if(confirm(`کاربر «${user.username}» حذف شود؟`)){
          state.users = state.users.filter(u=>u.id!==id);
          await storeSet('users', state.users, false);
          render();
          toast('کاربر حذف شد');
        }
      });
    });
  }

  if(state.screen==='about'){
    document.getElementById('btn-logout2').addEventListener('click', doLogout);
    document.getElementById('btn-toggle-theme').addEventListener('click', toggleTheme);
    document.querySelectorAll('#provider-selector .chip').forEach(c=>{
      c.addEventListener('click', ()=>{
        localStorage.setItem('pajouhyar_provider', c.dataset.provider);
        document.querySelectorAll('#provider-selector .chip').forEach(x=>x.classList.remove('selected'));
        c.classList.add('selected');
        document.querySelectorAll('.provider-block').forEach(b=>{
          b.style.display = (b.dataset.providerBlock === c.dataset.provider) ? 'flex' : 'none';
        });
      });
    });
    document.querySelectorAll('[data-open-guide]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        window.open(AI_PROVIDERS[btn.dataset.openGuide].guideUrl, '_blank');
      });
    });
    document.getElementById('btn-save-key').addEventListener('click', ()=>{
      Object.keys(AI_PROVIDERS).forEach(p=>{
        const el = document.getElementById('key-input-'+p);
        const v = el.value.trim();
        if(v) localStorage.setItem(AI_PROVIDERS[p].keyName, v);
        else localStorage.removeItem(AI_PROVIDERS[p].keyName);
      });
      toast('تنظیمات ذخیره شد');
    });
  }
}

function doLogout(){
  state.currentUser=null; state.screen='login'; state.tab='home';
  state.researchSections=[]; state.researchOptions=null; state.analyzeResult=null;
  render();
}

init();
</script>
